# ────────────────────────────────────────────────────────────────
# Artifacts: versioned outputs registered with DVC for tracking.
# ────────────────────────────────────────────────────────────────
artifacts:
  aftercourt-documents-dataset:
    path: data/raw/final_raw_data.csv
    type: dataset
    desc: The raw dataset containing document text, metadata and labels. Starting point for all targets.
  tf-idf-vectorizer:
    path: models/vectorizers/vectorizer.dill
    type: model
    desc: Shared TF-IDF vectorizer fitted on training data. Reused across all targets.
  ladung-rf-classifier:
    path: models/classification/ladung_rf_classifier.dill
    type: model
    desc: Random Forest classifier for ladung documents.
  pfub-rf-classifier:
    path: models/classification/pfub_rf_classifier.dill
    type: model
    desc: Random Forest classifier for pfub documents.

# ────────────────────────────────────────────────────────────────
# Stages: the ML pipeline.
#
# Uses DVC "foreach" to loop over document-type targets (ladung, pfub, …).
# Each foreach stage produces named stages like prepare@ladung, train@pfub, etc.
#
# To run the full pipeline:       dvc repro
# To run only one target:         dvc repro evaluate@ladung
# To run only one stage:          dvc repro train@pfub
# ────────────────────────────────────────────────────────────────
stages:

  # ── prepare ──────────────────────────────────────────────────
  # Splits raw CSV into train/test sets with target-specific preprocessing.
  # One stage per target: prepare@ladung, prepare@pfub, …
  prepare:
    foreach:
      - ladung
      - pfub
    do:
      cmd: python src/prepare/prepare.py data/raw/final_raw_data.csv ${item}
      deps:
        - data/raw/final_raw_data.csv
        - src/prepare/prepare.py
      params:
        - prepare.${item}
        - prepare.seed
        - prepare.split
      outs:
        - data/prepared/${item}/test.csv
        - data/prepared/${item}/train.csv

  # ── fit_vectorizer ───────────────────────────────────────────
  # Fits a shared TF-IDF vectorizer on the ladung training set.
  # Since the target does not affect vectorizer fitting, this stage is outside the foreach loop and runs only once.
  # Shared across all targets — NOT inside the foreach loop.
  # Must run after prepare@ladung.
  fit_vectorizer:
    desc: Fit a shared TF-IDF vectorizer on ladung training data.
    cmd: python src/featurazition/fit_vectorizer.py data/prepared/ladung/train.csv models/vectorizers/vectorizer.dill
    deps:
      - src/featurazition/fit_vectorizer.py
      - data/prepared/ladung/train.csv
    params:
      - fit_vectorizer.seed
      - fit_vectorizer.vectorizer
    outs:
      - models/vectorizers/vectorizer.dill

  # ── featurize ────────────────────────────────────────────────
  # Transforms prepared text into TF-IDF feature matrices using the shared vectorizer.
  # One stage per target: featurize@ladung, featurize@pfub, …
  featurize:
    foreach:
      - ladung
      - pfub
    do:
      cmd: python src/featurazition/featurazition.py data/prepared/${item} models/vectorizers/vectorizer.dill data/featurized/${item} ${item}
      deps:
        - src/featurazition/featurazition.py
        - data/prepared/${item}/train.csv
        - data/prepared/${item}/test.csv
        - models/vectorizers/vectorizer.dill
      params:
        - prepare.${item}.target_col
      outs:
        - data/featurized/${item}/train_features.npz
        - data/featurized/${item}/train_labels.npy
        - data/featurized/${item}/test_features.npz
        - data/featurized/${item}/test_labels.npy

  # ── train ────────────────────────────────────────────────────
  # Trains a Random Forest classifier on featurized data.
  # One stage per target: train@ladung, train@pfub, …
  train:
    foreach:
      - ladung
      - pfub
    do:
      cmd: python src/training/train.py data/featurized/${item} models/classification/${item}_rf_classifier.dill ${item}
      deps:
        - src/training/train.py
        - data/featurized/${item}/train_features.npz
        - data/featurized/${item}/train_labels.npy
      params:
        - train.seed
        - train.${item}.classifier
      outs:
        - models/classification/${item}_rf_classifier.dill

  # ── evaluate ─────────────────────────────────────────────────
  # Evaluates the trained model on the test set and produces metrics + plots.
  # One stage per target: evaluate@ladung, evaluate@pfub, …
  evaluate:
    foreach:
      - ladung
      - pfub
    do:
      cmd: python src/eval/eval.py models/classification/${item}_rf_classifier.dill data/featurized/${item} data/evaluation/${item} ${item}
      deps:
        - src/eval/eval.py
        - models/classification/${item}_rf_classifier.dill
        - data/featurized/${item}/test_features.npz
        - data/featurized/${item}/test_labels.npy
      params:
        - evaluate.${item}.threshold
      metrics:
        - data/evaluation/${item}/metrics.json:
            cache: false
      plots:
        - data/evaluation/${item}/predictions.json:
            cache: false
            x: y_pred_prob
            y: y_true

